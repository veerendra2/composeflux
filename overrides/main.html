{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title | default(config.site_name, true) }}">
  <meta property="og:description" content="{{ config.site_description }}">
  <meta property="og:url" content="{{ page.canonical_url }}">
  <meta property="og:image" content="{{ config.site_url }}assets/composeflux-banner.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:image" content="{{ config.site_url }}assets/composeflux-banner.png">
{% endblock %}
